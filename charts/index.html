<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>JPR KING TV — My Charts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy: #0a1a33;
        --navy-deep: #061224;
        --gold: #c9a24b;
        --gold-bright: #e6c15c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: linear-gradient(165deg, var(--navy) 0%, var(--navy-deep) 70%);
        color: #f4f6fb;
        font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 32px 20px;
      }
      .door { text-align: center; max-width: 880px; width: 100%; }
      .crown { display: block; margin: 0 auto 10px; width: clamp(84px, 12vw, 132px); height: auto; }
      h1 {
        font-family: "Barlow Condensed", "Barlow", sans-serif;
        font-size: clamp(56px, 10vw, 118px);
        letter-spacing: 5px;
        line-height: 1;
        margin: 0;
        color: #ffffff;
      }
      .personal {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 22px;
        border: 2px solid var(--gold);
        border-radius: 999px;
        color: var(--gold-bright);
        font-weight: 700;
        font-size: clamp(17px, 2.4vw, 24px);
        letter-spacing: 3px;
      }
      .motto {
        margin-top: 18px;
        font-size: clamp(14px, 2vw, 19px);
        font-weight: 600;
        letter-spacing: 3px;
        color: var(--gold-bright);
      }
      .btn-gold {
        display: flex; align-items: center; justify-content: center;
        margin: clamp(36px, 6vh, 64px) auto 0;
        width: 100%; max-width: 720px;
        min-height: clamp(96px, 15vh, 132px);
        border-radius: 18px;
        background: linear-gradient(180deg, var(--gold-bright), var(--gold));
        color: #231a02;
        font-family: "Barlow Condensed", "Barlow", sans-serif;
        font-size: clamp(34px, 5.5vw, 52px);
        font-weight: 700;
        letter-spacing: 2px;
        text-decoration: none;
        padding: 20px 28px;
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
      }
      .btn-gold:active { transform: translateY(2px); }
      .next {
        margin-top: 18px;
        font-size: clamp(16px, 2.2vw, 22px);
        color: #c8d3e6;
      }
      [hidden] { display: none !important; }
      .gate-input {
        display: block;
        margin: clamp(36px, 6vh, 64px) auto 0;
        width: 100%; max-width: 720px;
        min-height: clamp(84px, 13vh, 112px);
        border-radius: 18px;
        border: 2px solid var(--gold);
        background: rgba(6, 18, 36, 0.65);
        color: #ffffff;
        font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: clamp(28px, 4.5vw, 40px);
        font-weight: 600;
        letter-spacing: 4px;
        text-align: center;
        padding: 16px 24px;
      }
      .gate-input::placeholder { color: #8fa3c4; letter-spacing: 2px; }
      .gate-input:focus { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
      .btn-unlock { margin-top: 22px; border: 0; cursor: pointer; }
      .gate-error {
        margin-top: 18px;
        font-size: clamp(17px, 2.4vw, 23px);
        font-weight: 600;
        color: #ff7a72;
      }
      @keyframes gate-shake {
        10%, 90% { transform: translateX(-2px); }
        20%, 80% { transform: translateX(4px); }
        30%, 50%, 70% { transform: translateX(-7px); }
        40%, 60% { transform: translateX(7px); }
      }
      .shake { animation: gate-shake 0.5s ease both; }
    </style>
  </head>
  <body>
    <main class="door">
      <svg class="crown" viewBox="0 0 24 24" fill="none" stroke="#e6c15c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.735H5.81a1 1 0 0 1-.957-.735L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" fill="#c9a24b"/>
        <path d="M5 21h14"/>
      </svg>
      <h1>JPR KING TV</h1>
      <div><span class="personal">👑 PERSONAL</span></div>
      <div class="motto">GOD IS GOOD ALL THE TIME</div>

      <form id="gateForm">
        <input id="gateInput" class="gate-input" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" autofocus />
        <button class="btn-gold btn-unlock" type="submit">Unlock</button>
        <div id="gateError" class="gate-error" hidden>Wrong code — try again</div>
      </form>

      <div id="doorContent" hidden>
        <!-- CHARTS HREF -->
        <a class="btn-gold" href="https://muse.ai/library/artifacts/jpr-king-tv-charts">👑 Open My Charts</a>
        <div class="next">Straight to your charts</div>
      </div>
    </main>
    <script>
      (function () {
        var GATE_HASH = "36c25bcaa45239341e0c5bee4bcbe19538c0d5289078768cdcba5b9be4c31dca";
        var GATE_KEY = "jprChartsGate";
        var gateForm = document.getElementById("gateForm");
        var doorContent = document.getElementById("doorContent");
        var gateInput = document.getElementById("gateInput");
        var gateError = document.getElementById("gateError");

        function unlock() {
          gateForm.hidden = true;
          doorContent.hidden = false;
        }

        try {
          if (window.localStorage.getItem(GATE_KEY) === GATE_HASH) {
            unlock();
            return;
          }
        } catch (e) { /* storage unavailable: the gate still works for this visit */ }

        function sha256Hex(text) {
          return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
            return Array.prototype.map.call(new Uint8Array(buf), function (b) {
              return ("0" + b.toString(16)).slice(-2);
            }).join("");
          });
        }

        gateForm.addEventListener("submit", function (event) {
          event.preventDefault();
          sha256Hex(gateInput.value).then(function (hex) {
            if (hex === GATE_HASH) {
              try { window.localStorage.setItem(GATE_KEY, GATE_HASH); } catch (e) {}
              gateError.hidden = true;
              unlock();
            } else {
              gateInput.value = "";
              gateError.hidden = false;
              gateForm.classList.remove("shake");
              void gateForm.offsetWidth;
              gateForm.classList.add("shake");
              gateInput.focus();
            }
          });
        });
      })();
    </script>
  </body>
</html>
